<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clinic Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12241d; --paper:#f5f7f3; --card:#ffffff; --line:#e2e9e4; --muted:#66766d;
    --forest:#0f5c3d; --forest-dark:#0b4530; --mint:#dcf3e6;
    --amber:#a3690f; --amber-bg:#fbf1de; --red:#b8433f; --red-bg:#fbe9e8;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Manrope',sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    overflow:hidden;position:relative;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;
    animation:drift 14s ease-in-out infinite alternate;}
  .glow.a{width:420px;height:420px;background:var(--mint);top:-140px;left:-120px;}
  .glow.b{width:360px;height:360px;background:#cfe9dc;bottom:-160px;right:-100px;animation-delay:2s;}
  @keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(30px,-20px) scale(1.08);}}

  .kiosk{position:relative;z-index:1;width:100%;max-width:540px;}
  .progress{display:flex;gap:8px;justify-content:center;margin-bottom:22px;}
  .dot{height:5px;flex:1;max-width:44px;border-radius:3px;background:var(--line);transition:background .4s var(--ease);}
  .dot.done,.dot.now{background:var(--forest);}

  .stage{background:var(--card);border-radius:28px;padding:36px 30px;
    box-shadow:0 24px 60px -18px rgba(15,92,61,.28), 0 2px 8px rgba(15,36,29,.04);
    min-height:420px;display:flex;flex-direction:column;}
  .stage.enter{animation:stageIn .46s var(--ease) both;}
  @keyframes stageIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

  .eyebrow{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:600;font-size:clamp(1.7rem,4vw,2.1rem);line-height:1.18;letter-spacing:-.025em;}
  h1 em{font-style:italic;font-weight:500;color:var(--forest);}
  .sub{color:var(--muted);font-size:.88rem;margin-top:6px;line-height:1.5;}

  .options{margin-top:24px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;max-height:52vh;-webkit-overflow-scrolling:touch;}
  .options.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  /* Equal width always; click animation allowed via .opt-click */
  .options{width:100%;align-items:stretch;}
  .options .opt,
  button.opt{
    width:100%;
    max-width:100%;
    min-height:56px;
    align-self:stretch;
    flex-shrink:0;
    box-sizing:border-box;
  }
  .options .opt.picked,
  button.opt.picked{
    width:100%;
    min-height:56px;
  }
  /* Satisfying click bounce (runs once, ends at normal size) */
  @keyframes optClick {
    0%   { transform: scale(1); }
    35%  { transform: scale(0.96); }
    70%  { transform: scale(1.015); }
    100% { transform: scale(1); }
  }
  .opt.opt-click{
    animation: optClick 0.42s cubic-bezier(.22,1,.36,1) both;
  }
  .opt:active{
    background:var(--mint);
    box-shadow:inset 0 2px 10px rgba(15,92,61,.16), 0 0 0 3px rgba(15,92,61,.14);
  }
  .opt.pressing{
    box-shadow:0 0 0 4px rgba(15,92,61,.2), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .ripple{
    background:rgba(15,92,61,.28) !important;
  }

  .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:.95rem;color:var(--ink);
    transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
    text-align:left;position:relative;overflow:hidden;isolation:isolate;
    width:100%;box-sizing:border-box;min-height:56px;}
  .opt .ic{font-size:1.3rem;flex-shrink:0;position:relative;z-index:1;}
  .opt > span:not(.ripple), .opt > div{position:relative;z-index:1;}
  .opt:active{filter:brightness(0.97);}
  .opt:hover{border-color:var(--forest);box-shadow:0 4px 14px -6px rgba(15,92,61,.18);}
  .opt.picked{background:var(--mint);border-color:var(--forest);color:var(--forest-dark);}
  .opt.tone-mild.picked{background:var(--mint);border-color:var(--forest);}
  .opt.tone-moderate.picked{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
  .opt.tone-severe.picked{background:var(--red-bg);border-color:var(--red);color:var(--red);}

  textarea{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
    font-family:'Manrope',sans-serif;font-size:.95rem;resize:none;min-height:110px;transition:border-color .2s;}
  textarea:focus{outline:none;border-color:var(--forest);}
  .text-input{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:16px;padding:16px;
    font-family:'Manrope',sans-serif;font-size:1rem;color:var(--ink);transition:border-color .2s;}
  .text-input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 4px rgba(15,92,61,.12);}
  .field-error{color:var(--red);font-size:.8rem;min-height:1.2em;margin-top:7px;}

  .actions{margin-top:auto;padding-top:22px;display:flex;gap:10px;}
  .opt,.btn{min-height:48px;-webkit-tap-highlight-color:transparent;}
  .btn{flex:1;border:none;border-radius:16px;padding:16px;font-family:'Manrope',sans-serif;font-weight:800;
    font-size:.95rem;cursor:pointer;transition:transform .15s var(--ease), filter .2s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--forest);color:#fff;box-shadow:0 10px 24px -8px rgba(15,92,61,.55);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--paper);color:var(--muted);}
  .back{align-self:flex-start;border:none;background:none;color:var(--muted);font-weight:700;font-size:.85rem;
    cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:4px;}

  .welcome{align-items:center;text-align:center;justify-content:center;gap:6px;}
  .badge{width:64px;height:64px;border-radius:20px;background:linear-gradient(150deg,var(--forest),var(--forest-dark));
    display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 18px;
    box-shadow:0 14px 28px -10px rgba(15,92,61,.55);animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .welcome h1{font-size:1.7rem;}
  .welcome .sub{max-width:320px;margin-left:auto;margin-right:auto;}
  .tap-btn{margin-top:28px;width:100%;padding:20px;border:none;border-radius:18px;background:var(--forest);
    color:#fff;font-family:'Manrope';font-weight:800;font-size:1.05rem;cursor:pointer;
    box-shadow:0 14px 30px -10px rgba(15,92,61,.55);animation:breathe 2.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{box-shadow:0 14px 30px -10px rgba(15,92,61,.55);}50%{box-shadow:0 18px 38px -8px rgba(15,92,61,.7);}}
  .privacy{margin-top:16px;font-size:.72rem;color:var(--muted);}

  .check{width:70px;height:70px;margin:0 auto 16px;}
  .check circle{stroke:var(--forest);stroke-width:3;fill:none;stroke-dasharray:180;stroke-dashoffset:180;
    animation:circleDraw .5s var(--ease) forwards;}
  .check path{stroke:var(--forest);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:40;stroke-dashoffset:40;animation:checkDraw .35s var(--ease) .45s forwards;}
  @keyframes circleDraw{to{stroke-dashoffset:0;}}
  @keyframes checkDraw{to{stroke-dashoffset:0;}}

  .ticket{position:relative;background:var(--paper);border-radius:18px;padding:20px 22px;margin-top:18px;}
  .ticket::before,.ticket::after{content:'';position:absolute;width:22px;height:22px;background:var(--card);
    border-radius:50%;top:50%;transform:translateY(-50%);}
  .ticket::before{left:-11px;} .ticket::after{right:-11px;}
  .trow{display:flex;justify-content:space-between;font-size:.85rem;padding:7px 0;border-bottom:1px dashed var(--line);}
  .trow:last-child{border:none;}
  .trow span:first-child{color:var(--muted);}
  .trow span:last-child{font-weight:700;text-align:right;max-width:60%;}
  .refcode{text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;letter-spacing:1px;
    color:var(--forest-dark);margin-top:14px;}
  .timer{text-align:center;font-size:.75rem;color:var(--muted);margin-top:16px;}

  @media(max-width:400px){.options.grid{grid-template-columns:1fr;}}

  #idleScreen{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:flex-end;
    justify-content:center;overflow:hidden;}
  #idleVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .idle-scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,0) 65%);}
  .idle-content{position:relative;z-index:1;text-align:center;color:#fff;padding-bottom:56px;width:100%;}
  .idle-content h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.4rem;}
  .idle-content p{font-size:.85rem;opacity:.85;margin-top:4px;}
  .chevrons{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:-6px;}
  .chevrons span{display:block;width:26px;height:26px;border-top:3px solid #fff;border-right:3px solid #fff;
    transform:rotate(-45deg);opacity:.25;animation:chevUp 1.6s ease-in-out infinite;}
  .chevrons span:nth-child(2){animation-delay:.15s;margin-top:-14px;}
  .chevrons span:nth-child(3){animation-delay:.3s;margin-top:-14px;}
  @keyframes chevUp{0%{opacity:.15;transform:rotate(-45deg) translateY(6px);}50%{opacity:1;transform:rotate(-45deg) translateY(-2px);}100%{opacity:.15;transform:rotate(-45deg) translateY(6px);}}
  .idle-screen-out{animation:idleOut .4s var(--ease) forwards;}
  @keyframes idleOut{to{transform:translateY(-100%);opacity:0;}}

  .stage.enter{animation:stageFwd .6s var(--ease) both;}
  .stage.enter.back{animation-name:stageBack;}
  @keyframes stageFwd{from{opacity:0;transform:translateX(30px) scale(.98);}to{opacity:1;transform:none;}}
  @keyframes stageBack{from{opacity:0;transform:translateX(-30px) scale(.98);}to{opacity:1;transform:none;}}
  .eyebrow{display:inline-block;align-self:flex-start;background:var(--mint);color:var(--forest-dark);padding:4px 11px;border-radius:20px;font-weight:700;}
  .dot.now{transform-origin:left;animation:dotGrow .6s var(--ease);}
  @keyframes dotGrow{from{transform:scaleX(.2);}to{transform:none;}}
  .opt,
  .btn{position:relative;overflow:hidden;}
  .opt{animation:optIn .45s var(--ease) both;font-size:1.05rem;}
  @keyframes optIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .opt.picked{animation:none;}
  .opt.picked{animation:none;box-shadow:0 0 0 4px rgba(15,92,61,.12);width:100%;}
  .opt.picked::after{content:'✓';margin-left:auto;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--forest);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;animation:pop .45s cubic-bezier(.34,1.56,.64,1);}
  .opt.tone-moderate.picked::after{background:var(--amber);} .opt.tone-severe.picked::after{background:var(--red);}
  @keyframes pop{from{opacity:0;transform:scale(0.6);}to{opacity:1;transform:scale(1);}}
  .ripple{
    position:absolute;border-radius:50%;background:rgba(15,92,61,.2);
    transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none;
    z-index:0;will-change:transform,opacity;
  }
  .btn-primary .ripple{background:rgba(255,255,255,.32);}
  @keyframes rip{
    to{transform:scale(2.2);opacity:0;}
  }
  textarea:focus{box-shadow:0 0 0 4px rgba(15,92,61,.12);}

  #idleScreen{background:linear-gradient(-45deg,#0b4530,#0f5c3d,#12395e,#0b4530);background-size:400% 400%;animation:bgShift 14s ease infinite;}
  @keyframes bgShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  #idleVideo{animation:kb 26s ease-in-out infinite alternate;}
  @keyframes kb{from{transform:scale(1);}to{transform:scale(1.07);}}
  .idle-top{position:absolute;top:9vh;left:0;right:0;text-align:center;color:#fff;z-index:1;animation:stageBack 1s var(--ease) both;}
  .clock{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:600;font-size:clamp(3.6rem,13vw,6.5rem);letter-spacing:-.04em;line-height:1;text-shadow:0 6px 34px rgba(0,0,0,.4);}
  .cdate{font-size:1.05rem;font-weight:600;opacity:.88;margin-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .idle-content h2{font-size:1.7rem;}

  .checkwrap{position:relative;width:70px;height:70px;margin:0 auto 16px;}
  .checkwrap .check{margin:0;}
  .spark{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;opacity:0;animation:spark .9s ease-out forwards;}
  @keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3);}}
  .ticket{animation:printOut 1s var(--ease) .55s backwards;}
  @keyframes printOut{from{clip-path:inset(0 -20px 100% -20px);transform:translateY(-16px);}to{clip-path:inset(0 -20px -20px -20px);transform:none;}}
  .trow{animation:rowIn .5s var(--ease) backwards;}
  .trow:nth-child(1){animation-delay:.9s;}.trow:nth-child(2){animation-delay:.98s;}.trow:nth-child(3){animation-delay:1.06s;}
  .trow:nth-child(4){animation-delay:1.14s;}.trow:nth-child(5){animation-delay:1.22s;}.trow:nth-child(6){animation-delay:1.3s;}
  @keyframes rowIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
  .refcode{animation:rowIn .6s var(--ease) 1.35s backwards;}
  .drain{height:3px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden;}
  .drain i{display:block;height:100%;background:var(--forest);animation:drain 15s linear forwards;}
  @keyframes drain{from{width:100%;}to{width:0;}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;}}

/* ===== Staff drawer (improved + real photos) ===== */
.staff-tab{
  position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:46;
  width:46px;height:100px;border:none;cursor:pointer;
  background:linear-gradient(160deg,#1b2f8c,#0c1650);color:#fff;
  border-radius:0 20px 20px 0;font-size:1.6rem;font-weight:800;letter-spacing:-3px;
  box-shadow:6px 8px 28px -6px rgba(12,22,80,.6);
  transition:transform .45s var(--ease), left .45s var(--ease), box-shadow .3s;
  animation:tabNudge 2.6s ease-in-out infinite;
}
.staff-tab:active{transform:translateY(-50%) scale(.94);}
.staff-tab.open{left:310px;animation:none;box-shadow:none;}
@keyframes tabNudge{0%,100%{padding-left:0;}50%{padding-left:10px;}}

.staff-backdrop{
  position:fixed;inset:0;z-index:44;background:rgba(8,14,30,.55);
  opacity:0;pointer-events:none;transition:opacity .45s var(--ease);
  backdrop-filter:blur(4px);
}
.staff-backdrop.show{opacity:1;pointer-events:auto;}

.staff-drawer{
  position:fixed;top:0;left:0;bottom:0;width:310px;z-index:45;
  background:linear-gradient(165deg,#1a2d88 0%,#0b1448 55%,#081030 100%);color:#fff;
  padding:28px 16px 24px;overflow-y:auto;
  transform:translateX(-104%);transition:transform .55s var(--ease);
  box-shadow:20px 0 60px -12px rgba(0,0,0,.55);
}
.staff-drawer.open{transform:none;}
.staff-drawer h3{
  font-family:'Fraunces',serif;font-weight:600;font-size:1.32rem;
  margin:0 8px 2px;letter-spacing:-.02em;
}
.staff-drawer .sd-sub{font-size:.74rem;color:#9ec0e0;margin:0 8px 20px;opacity:.9;}

.sd-card{
  display:flex;gap:14px;align-items:center;padding:13px 12px;margin-bottom:11px;border-radius:16px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  opacity:0;transform:translateX(-22px) scale(.96);
  transition:background .25s, transform .2s, box-shadow .25s;
  cursor:default;
}
.staff-drawer.open .sd-card{animation:sdIn .65s var(--ease) forwards;}
.sd-card:active{transform:scale(.97);}
.sd-card:hover{background:rgba(255,255,255,.12);box-shadow:0 8px 24px -10px rgba(0,0,0,.4);}
@keyframes sdIn{to{opacity:1;transform:none;}}

.sd-avatar{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;object-fit:cover;
  border:2.5px solid #3a52d4;
  background:linear-gradient(145deg,#2a3fc9,#1a2a8a);
  display:grid;place-items:center;
  font-weight:800;font-size:1.05rem;overflow:hidden;
  box-shadow:0 0 0 0 rgba(90,120,255,.4);
  transition:box-shadow .4s, transform .35s;
}
.staff-drawer.open .sd-avatar{
  animation:avatarGlow 2.2s ease-in-out infinite alternate;
}
@keyframes avatarGlow{
  from{box-shadow:0 0 0 0 rgba(90,120,255,.25);}
  to{box-shadow:0 0 18px 4px rgba(90,120,255,.45);}
}
.sd-avatar img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
  display:block;
}

.sd-name{font-weight:800;font-size:.88rem;line-height:1.25;letter-spacing:-.01em;}
.sd-role{font-size:.7rem;color:#9cc3e2;margin-top:3px;line-height:1.4;opacity:.92;}

.sd-close{
  position:absolute;top:16px;right:16px;border:none;background:rgba(255,255,255,.12);
  color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.05rem;
  transition:background .2s, transform .2s;
}
.sd-close:active{transform:scale(.9);background:rgba(255,255,255,.22);}

@media (prefers-reduced-motion:reduce){
  .staff-tab{animation:none;}
  .staff-drawer.open .sd-avatar{animation:none;}
}

/* ===== Staff tabs, records, stock ===== */
.staff-tabs{
  display:flex;gap:6px;margin:0 4px 16px;padding:4px;
  background:rgba(0,0,0,.2);border-radius:12px;
}
.staff-tab-btn{
  flex:1;border:none;background:transparent;color:#9cc3e2;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:.72rem;
  padding:8px 6px;border-radius:9px;cursor:pointer;
  transition:background .2s, color .2s;
}
.staff-tab-btn.active{
  background:rgba(255,255,255,.14);color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.staff-panel{display:none;}
.staff-panel.active{display:block;}

.rec-search{
  width:100%;margin-bottom:12px;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
  color:#fff;font-family:'Manrope',sans-serif;font-size:.82rem;
}
.rec-search::placeholder{color:#8ab0d0;}
.rec-search:focus{outline:none;border-color:#5a7aff;background:rgba(255,255,255,.12);}

.rec-item,.stock-item{
  padding:11px 12px;margin-bottom:8px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  font-size:.78rem;
}
.rec-item .ri-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.rec-item .ri-name{font-weight:800;font-size:.84rem;color:#fff;}
.rec-item .ri-meta{color:#9cc3e2;margin-top:3px;line-height:1.35;}
.rec-item .ri-badge{
  flex-shrink:0;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:20px;
  background:rgba(15,92,61,.35);color:#9dffc8;
}
.rec-item .ri-badge.feed{background:rgba(163,105,15,.3);color:#ffd78a;}
.rec-empty{text-align:center;color:#8ab0d0;font-size:.8rem;padding:24px 12px;}

.stock-item{display:flex;align-items:center;gap:10px;}
.stock-item .si-info{flex:1;min-width:0;}
.stock-item .si-name{font-weight:800;font-size:.84rem;color:#fff;}
.stock-item .si-cat{font-size:.68rem;color:#9cc3e2;margin-top:2px;}
.stock-item .si-qty{
  font-weight:800;font-size:1rem;min-width:36px;text-align:center;
  padding:4px 0;border-radius:8px;
}
.stock-item .si-qty.ok{color:#7dffb0;}

<script>
var API = "";
var submitBusy = false;

/* ---- Step definitions ---- */
var PURPOSE_STEP = {
  key: 'purpose',
  title: 'What do you need <em>today</em>?',
  options: [
    { v: 'Feeding', ic: '🍽️', label: 'Feeding' },
    { v: 'Consultation', ic: '🩺', label: 'Clinic Consultation' }
  ]
};

var NAME_STEP = {
  key: 'name',
  title: 'What is your <em>name</em>?',
  input: true
};

var GRADE_STEP = {
  key: 'grade',
  title: 'What <em>grade</em> are you in?',
  options: [
    { v: 'Grade 11', ic: '🎓' },
    { v: 'Grade 12', ic: '🎓' }
  ]
};

/* Sections per grade (shown after Grade is chosen) */
var SECTIONS = {
  'Grade 11': [
    'Advocates', 'Ambassadors', 'Analysts', 'Aspirers', 'Builders',
    'Catalysists', 'Conquerors', 'Designers', 'Developers', 'Diplomats',
    'Empericists', 'Innovators', 'Luminaries', 'Pathfinders', 'Practitioners',
    'Strategists', 'Thinkers', 'Voyagers'
  ],
  'Grade 12': [
    'Einstein', 'Fibonacci', 'Laplace', 'Leibniz', 'Euler',
    'Descartes', 'Euclid', 'Pascal', 'Pearson', 'Newton',
    'McGregor', 'Philip Crosby', 'Mayo', 'Luca Pacioli', 'Aquinas',
    'Aurelius', 'Confucius', 'Mencius', 'Freud', 'Shakespeare'
  ]
};

function getSectionStep() {
  var list = SECTIONS[answers.grade] || [];
  return {
    key: 'section',
    title: 'Which <em>section</em> are you in?',
    grid: true,
    options: list.map(function (name) {
      return { v: name, label: name };
    })
  };
}

var ILLNESS_STEP = {
  key: 'illness',
  title: "What's <em>bothering</em> you today?",
  grid: true,
  options: [
    { v: 'Headache', ic: '🤕' },
    { v: 'Fever', ic: '🤒' },
    { v: 'Stomachache', ic: '🤢' },
    { v: 'Vomiting', ic: '🤮' },
    { v: 'Minor Injury', ic: '🩹' },
    { v: 'Cough/Colds', ic: '🤧' },
    { v: 'Allergy', ic: '🌿' },
    { v: 'Dizziness', ic: '💫' },
    { v: 'Menstrual Cramps', ic: '🩸' },
    { v: 'Others', ic: '➕' }
  ]
};

var SEVERITY_STEP = {
  key: 'severity',
  title: 'How <em>severe</em> does it feel?',
  options: [
    { v: 'mild', label: 'Mild', tone: 'mild' },
    { v: 'moderate', label: 'Moderate', tone: 'moderate' },
    { v: 'severe', label: 'Severe', tone: 'severe' }
  ]
};

var ACTION_STEP = {
  key: 'action',
  title: 'Anything <em>done</em> already?',
  text: true
};

/* Name required for Feeding only (kiosk). Consultation stays optional/anonymous. */
function getSteps() {
  var steps = [PURPOSE_STEP];
  if (answers.purpose === 'Feeding') steps.push(NAME_STEP);
  steps.push(GRADE_STEP);
  if (answers.grade) {
    steps.push(getSectionStep());
    if (answers.purpose === 'Consultation') {
      steps = steps.concat([ILLNESS_STEP, SEVERITY_STEP, ACTION_STEP]);
    }
  }
  var total = steps.length;
  for (var i = 0; i < steps.length; i++) {
    steps[i].eyebrow = 'Step ' + (i + 1) + ' of ' + total;
  }
  return steps;
}

var current = -1;
var answers = {};
var resetTimer = null;
var dir = 1;

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderProgress() {
  var p = document.getElementById('progress');
  var steps = getSteps();
  if (current < 0 || current > steps.length - 1) {
    p.style.display = 'none';
    return;
  }
  p.style.display = 'flex';
  var html = '';
  for (var i = 0; i < steps.length; i++) {
    var cls = i < current ? 'dot done' : (i === current ? 'dot now' : 'dot');
    html += '<div class="' + cls + '"></div>';
  }
  p.innerHTML = html;
}

function optHTML(step, o, i) {
  var picked = answers[step.key] === o.v ? ' picked' : '';
  var tone = o.tone ? ' tone-' + o.tone : '';
  var icon = o.ic ? '<span class="ic">' + o.ic + '</span>' : '';
  return '<button type="button" class="opt' + picked + tone + '" style="width:100%;transform:none;" onclick="pick(\'' + step.key + '\',\'' + o.v + '\',this)">' + icon + (o.label || o.v) + '</button>';
}

function render() {
  var stage = document.getElementById('stage');
  stage.classList.remove('enter');
  void stage.offsetWidth;
  stage.classList.add('enter');

  var steps = getSteps();
  renderProgress();

  /* ---- Success / Receipt screen ---- */
  if (current === steps.length) {
    stage.className = 'stage enter' + (dir < 0 ? ' back' : '');
    var r = answers;
    var isFeeding = r.purpose === 'Feeding';

    var rows = '';
    rows += '<div class="trow"><span>Purpose</span><span>' + esc(r.purpose) + '</span></div>';
    if (isFeeding || (r.name && r.name.trim())) {
      rows += r.nameSaveFailed
        ? '<div class="trow"><span>Student</span><span style="color:var(--red);font-weight:700;">Name not confirmed — tell clinic staff</span></div>'
        : '<div class="trow"><span>Student</span><span>' + esc(r.name) + '</span></div>';
    }
    rows += '<div class="trow"><span>Grade</span><span>' + esc(r.grade) + '</span></div>';
    rows += '<div class="trow"><span>Section</span><span>' + esc(r.section) + '</span></div>';
    if (!isFeeding) {
      rows += '<div class="trow"><span>Concern</span><span>' + esc(r.illness) + '</span></div>';
      rows += '<div class="trow"><span>Severity</span><span>' + esc(r.severity) + '</span></div>';
    }
    rows += '<div class="trow"><span>Time</span><span>' + esc(r.time) + '</span></div>';

    var titleHtml = isFeeding
      ? (r.nameSaveFailed
        ? '<h1 style="text-align:center;">Feeding saved, <em>name not confirmed</em></h1>'
        : '<h1 style="text-align:center;">Feeding <em>recorded</em></h1>')
      : '<h1 style="text-align:center;">Check-in <em>recorded</em></h1>';
    var subHtml = isFeeding
      ? (r.nameSaveFailed
        ? '<p class="sub" style="text-align:center;color:var(--red);">This record may be missing its name. Do not submit again; notify clinic staff to update/restart the server.</p>'
        : '<p class="sub" style="text-align:center;">Please proceed to clinic personnel.</p>')
      : '<p class="sub" style="text-align:center;">Please proceed to clinic personnel.</p>';

    stage.innerHTML =
      '<div class="checkwrap" id="burst"><svg class="check" viewBox="0 0 70 70"><circle cx="35" cy="35" r="28"/><path d="M22 36l9 9 17-19"/></svg></div>' +
      titleHtml +
      subHtml +
      '<div class="ticket">' + rows + '</div>' +
      '<div class="refcode">' + esc(r.ref) + '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-ghost" onclick="printReceipt()">🖨 Print slip</button>' +
        '<button class="btn btn-primary" onclick="clearTimeout(resetTimer); showIdle();">Done</button>' +
      '</div>' +
      '<div class="drain"><i></i></div><p class="timer" id="timerText"></p>';
    burst();
    startAutoReset();
    // Auto-print once — slightly delayed so receipt is complete
    lastPrintedRef = '';
    /* Countdown starts immediately (wall-clock). Print is deferred so the timer
       can paint at least once before Chrome's print() freezes the main thread.
       While the print dialog is open, numbers pause; after OK they jump to real time left. */
    setTimeout(function () {
      try { printReceipt(); } catch (e) {}
    }, 600);
    return;
  }

  var step = steps[current];
  stage.className = 'stage enter' + (dir < 0 ? ' back' : '');
  var back = current > 0 ? '<button class="back" onclick="goStep(current-1)">&larr; Back</button>' : '';
  var head = '<p class="eyebrow">' + step.eyebrow + '</p><h1>' + step.title + '</h1>';

  if (step.text) {
    stage.innerHTML = back + head +
      '<textarea id="actionInput" placeholder="e.g. Rested 15 mins, given water">' + esc(answers.action || '') + '</textarea>' +
      '<div class="actions">' +
        '<button class="btn btn-ghost" onclick="answers.action=\'\'; submitForm();">Skip</button>' +
        '<button class="btn btn-primary" onclick="answers.action=document.getElementById(\'actionInput\').value; submitForm();">Submit</button>' +
      '</div>';
    return;
  }

  if (step.input) {
    stage.innerHTML = back + head +
      '<input class="text-input" id="studentNameInput" type="text" maxlength="120" autocomplete="name" placeholder="Enter your full name">' +
      '<p class="field-error" id="nameError" role="alert"></p>' +
      '<div class="actions"><button class="btn btn-primary" onclick="continueWithName()">Continue →</button></div>';
    document.getElementById('studentNameInput').value = answers.name || '';
    document.getElementById('studentNameInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); continueWithName(); }
    });
    return;
  }

  var optsHTML = '';
  for (var i = 0; i < step.options.length; i++) {
    optsHTML += optHTML(step, step.options[i], i);
  }
  stage.innerHTML = back + head + '<div class="options' + (step.grid ? ' grid' : '') + '">' + optsHTML + '</div>';
}

function goStep(i) {
  dir = i < current ? -1 : 1;
  current = i;
  render();
}

function continueWithName() {
  var input = document.getElementById('studentNameInput');
  var name = input ? input.value.trim() : '';
  if (!name) {
    document.getElementById('nameError').textContent = 'Please enter your name before continuing.';
    if (input) input.focus();
    return;
  }
  answers.name = name;
  goStep(current + 1);
}

/* ---- Bluetooth receipt printing (RawBT) ---- */
function safeForPrinter(str) {
  return String(str || '').replace(/[^\x00-\xFF]/g, '');
}

function buildReceiptText(r) {
  // Please proceed at TOP so XP-58 never cuts it off
  var W = 32;
  function S(s) {
    return safeForPrinter(String(s == null ? '' : s)).replace(/\s+/g, ' ').trim();
  }
  function center(s) {
    s = S(s);
    if (s.length > W) s = s.slice(0, W);
    var p = Math.max(0, Math.floor((W - s.length) / 2));
    return Array(p + 1).join(' ') + s;
  }
  function col(label, value) {
    var L = S(label);
    var V = S(value || '-');
    if (L.length > 9) L = L.slice(0, 9);
    while (L.length < 9) L += ' ';
    var maxV = W - 11;
    if (V.length > maxV) V = V.slice(0, maxV);
    return L + '  ' + V;
  }
  var dash = Array(W + 1).join('-');
  var isFeeding = r.purpose === 'Feeding';
  var lines = [];
  lines.push('');
  lines.push(center('* * *'));
  lines.push(center('ALANGILAN SHS CLINIC'));
  lines.push(center(isFeeding ? 'Feeding Check-In' : 'Visit Check-In Slip'));
  lines.push(dash);
  // TOP — always visible
  lines.push(center('Please proceed to'));
  lines.push(center('clinic personnel'));
  lines.push(dash);
  lines.push(col('Purpose', r.purpose));
  if (isFeeding || (r.name && String(r.name).trim())) {
    lines.push(col('Student', r.nameSaveFailed ? 'NOT CONFIRMED' : (r.name || '-')));
  }
  lines.push(col('Grade', r.grade));
  lines.push(col('Section', r.section));
  if (!isFeeding) {
    lines.push(col('Concern', r.illness));
    lines.push(col('Severity', r.severity));
  }
  lines.push(col('Time', r.time));
  lines.push(col('Ref', r.ref || ''));
  lines.push(dash);
  lines.push(center('* * *'));
  lines.push('');
  lines.push('');

var printBusy = false;
var lastPrintedRef = '';

function printReceipt() {
  var ref = (answers && answers.ref) ? String(answers.ref) : '';
  if (printBusy) return;
  if (ref && ref === lastPrintedRef) return;
  printBusy = true;
  if (ref) lastPrintedRef = ref;
  try {
    var html = buildReceiptHTML(answers);
    var old = document.getElementById('printFrame');
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var iframe = document.createElement('iframe');
    iframe.id = 'printFrame';
    /* Keep a real layout size so slow tablets still compose print content */
    iframe.setAttribute('aria-hidden', 'true');
    iframe.style.cssText = 'position:fixed;left:0;top:0;width:58mm;height:1px;border:0;opacity:0.01;pointer-events:none;z-index:-1;';
    document.body.appendChild(iframe);

    var idoc = iframe.contentWindow.document;
    idoc.open();
    idoc.write(html);
    idoc.close();

    var done = false;
    function doPrint() {
      if (done) return;
      done = true;
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (e) {}
      /* Slow Windows tablets: do NOT remove iframe while dialog is opening */
      setTimeout(function () { printBusy = false; }, 2500);
      setTimeout(function () {
        try {
          var f = document.getElementById('printFrame');
          if (f && f.parentNode) f.parentNode.removeChild(f);
        } catch (e2) {}
      }, 12000);
    }

    /* Give laggy tablets time to layout receipt before opening print dialog */
    setTimeout(function () {
      try {
        if (iframe.contentWindow.document.readyState === 'complete') doPrint();
        else iframe.onload = doPrint;
      } catch (e3) {
        setTimeout(doPrint, 200);
      }
    }, 200);
  } catch (e) {
    printBusy = false;
  }
}


function pick(key, value, btn) {
  answers[key] = value;
  if (key === 'purpose' && value !== 'Feeding') {
    delete answers.name;
  }
  if (key === 'grade') {
    delete answers.section;
  }
  if (navigator.vibrate) navigator.vibrate(18);

  var all = document.querySelectorAll('.opt');
  for (var i = 0; i < all.length; i++) all[i].style.pointerEvents = 'none';
  if (btn) {
    btn.classList.add('picked');
    btn.classList.remove('opt-click');
    void btn.offsetWidth;
    btn.classList.add('opt-click');
    btn.classList.add('pressing');
    btn.style.width = '100%';
    setTimeout(function () {
      btn.classList.remove('pressing');
      btn.classList.remove('opt-click');
      btn.style.transform = '';
    }, 430);
  }

  setTimeout(function () {
    var steps = getSteps();

    if (key === 'section' && answers.purpose === 'Feeding') {
      submitForm();
      return;
    }

    if (current + 1 < steps.length) {
      goStep(current + 1);
    } else {
      submitForm();
    }
  }, 420);
}

document.addEventListener('pointerdown', function (e) {
  var t = e.target.closest('.opt, .btn');
  if (!t) return;
  // Contain ripple inside the button only
  if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
  var r = t.getBoundingClientRect();
  var x = e.clientX - r.left;
  var y = e.clientY - r.top;
  var d = Math.max(r.width, r.height) * 1.1;
  var sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.width = d + 'px';
  sp.style.height = d + 'px';
  sp.style.left = (x - d / 2) + 'px';
  sp.style.top = (y - d / 2) + 'px';
  t.appendChild(sp);
  setTimeout(function () {
    if (sp.parentNode) sp.parentNode.removeChild(sp);
  }, 560);
});

function burst() {
  var w = document.getElementById('burst');
  if (!w) return;
  var cols = ['#0f5c3d', '#2f9e68', '#9ad9b8', '#e8b93f'];
  for (var i = 0; i < 16; i++) {
    var a = (Math.PI * 2 / 16) * i + Math.random() * 0.3;
    var dist = 48 + Math.random() * 30;
    var sp = document.createElement('i');
    sp.className = 'spark';
    sp.style.cssText = '--x:' + Math.cos(a) * dist + 'px;--y:' + Math.sin(a) * dist + 'px;background:' + cols[i % 4] + ';animation-delay:' + (0.55 + Math.random() * 0.1) + 's';
    w.appendChild(sp);
  }
}



function addRecord(rec) {
  try {
    var key = 'alangilan_clinic_records';
    var list = JSON.parse(localStorage.getItem(key) || '[]');
    list.unshift(rec);
    if (list.length > 500) list = list.slice(0, 500);
    localStorage.setItem(key, JSON.stringify(list));
  } catch (e) {}
}

function finishCheckInLocal(savedId) {
  var now = new Date();
  answers.time = now.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
  answers.ref = 'AC-' + (savedId ? String(savedId).padStart(6, '0') : now.getTime().toString().slice(-6));
  answers.nameSaveFailed = false;
  addRecord({
    name: answers.purpose === 'Feeding' ? (answers.name || '') : (answers.name || ''),
    purpose: answers.purpose || '',
    grade: answers.grade || '',
    section: answers.section || '',
    illness: answers.illness || '',
    severity: answers.severity || '',
    action: answers.action || '',
    time: answers.time || '',
    ref: answers.ref || ''
  });
  submitBusy = false;
  var steps = getSteps();
  goStep(steps.length);
}

function submitForm() {
  if (submitBusy) return;
  submitBusy = true;
  var stage = document.getElementById('stage');
  stage.innerHTML = '<div class="welcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;"><p class="sub">Saving your check-in…</p></div>';

  // Offline only when opened as a local file (not via the server)
  if (location.protocol === 'file:') {
    setTimeout(function () { finishCheckInLocal(null); }, 280);
    return;
  }

  var payload = {
    purpose: answers.purpose,
    student_name: (answers.name || '').trim(),
    grade: answers.grade,
    section: answers.section,
    strand: '',
    illness: answers.illness || '',
    severity: answers.severity || '',
    action_taken: answers.action || ''
  };

  fetch(API + "/api/visits", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    cache: "no-store"
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (!res.ok) throw new Error(data.error || 'The server could not save this check-in.');
      return data;
    });
  }).then(function (saved) {
    if (answers.purpose === 'Feeding') {
      var enteredName = String(answers.name || '').trim();
      var confirmedName = String(saved && saved.student_name || '').trim();
      answers.nameSaveFailed = !confirmedName || confirmedName !== enteredName;
    }
    var now = new Date();
    var savedTime = saved && saved.visit_time ? new Date(saved.visit_time.replace(' ', 'T')) : now;
    if (isNaN(savedTime.getTime())) savedTime = now;
    answers.time = savedTime.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    answers.ref = 'AC-' + (saved && saved.id ? String(saved.id).padStart(6, '0') : now.getTime().toString().slice(-6));
    // Save to local health records (works offline too)
    addRecord({
      name: answers.purpose === 'Feeding' ? (answers.name || '') : (answers.name || ''),
      purpose: answers.purpose || '',
      grade: answers.grade || '',
      section: answers.section || '',
      illness: answers.illness || '',
      severity: answers.severity || '',
      action: answers.action || '',
      time: answers.time || '',
      ref: answers.ref || ''
    });
    submitBusy = false;
    var steps = getSteps();
    goStep(steps.length);
  }).catch(function (err) {
    submitBusy = false;
    stage.className = 'stage enter';
    stage.innerHTML = '<div class="welcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;">' +
      '<div class="badge" aria-hidden="true">!</div>' +
      '<h1>Check-in <em>not saved</em></h1>' +
      '<p class="sub" style="max-width:360px;color:var(--red);">' + esc(err && err.message ? err.message : 'Could not reach the clinic server. Please try again.') + '</p>' +
      '<div class="actions" style="width:100%;"><button class="btn btn-ghost" onclick="showIdle()">Cancel</button><button class="btn btn-primary" onclick="submitForm()">Try again</button></div>' +
      '<p class="privacy">No receipt will be printed until the server confirms the record.</p></div>';
  });
}

function startAutoReset() {
  clearTimeout(resetTimer);
  if (window._resetInterval) {
    try { clearInterval(window._resetInterval); } catch (e) {}
    window._resetInterval = null;
  }
  /* Wall-clock based: if Chrome print() freezes JS, when it resumes we jump to real remaining time */
  var endAt = Date.now() + 15000;
  function paint() {
    var left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    var el = document.getElementById('timerText');
    if (el) el.textContent = 'Returning to start in ' + left + 's';
    return left;
  }
  paint();
  window._resetInterval = setInterval(function () {
    var left = paint();
    if (left <= 0) {
      try { clearInterval(window._resetInterval); } catch (e1) {}
      window._resetInterval = null;
      showIdle();
    }
  }, 250);
}

function showIdle() {
  clearTimeout(resetTimer);
  if (window._resetInterval) {
    try { clearInterval(window._resetInterval); } catch (e) {}
    window._resetInterval = null;
  }
  answers = {};
  current = -1;
  var idle = document.getElementById('idleScreen');
  var kiosk = document.querySelector('.kiosk');
  idle.classList.remove('idle-screen-out');
  idle.style.display = 'flex';
  kiosk.style.display = 'none';
  var v = document.getElementById('idleVideo');
  try { v.currentTime = 0; v.play(); } catch (e) {}
}

function hideIdleAndStart() {
  var idle = document.getElementById('idleScreen');
  var kiosk = document.querySelector('.kiosk');
  idle.classList.add('idle-screen-out');
  setTimeout(function () {
    idle.style.display = 'none';
    idle.classList.remove('idle-screen-out');
    kiosk.style.display = 'block';
    current = -1;
    dir = 1;
    goStep(0);
  }, 380);
}

(function setupSwipe() {
  var idle = document.getElementById('idleScreen');
  var startY = null;
  idle.addEventListener('touchstart', function (e) { startY = e.touches[0].clientY; }, { passive: true });
  idle.addEventListener('touchend', function (e) {
    if (startY === null) return;
    var endY = e.changedTouches[0].clientY;
    if (startY - endY > 50) hideIdleAndStart();
    startY = null;
  }, { passive: true });
  idle.addEventListener('click', function () { hideIdleAndStart(); });
})();

var staffTimer = null;

(function buildStaff() {
  var html = '';
  STAFF.forEach(function (s, i) {
    html += '<div class="sd-card" style="animation-delay:' + (0.12 + i * 0.09) + 's">' +
      '<div class="sd-avatar">' +
        '<img src="' + s.photo + '" alt="' + s.name + '" ' +
        'onerror="this.style.display=\'none\'; this.parentNode.textContent=\'' + s.ini + '\'">' +
      '</div>' +
      '<div><div class="sd-name">' + s.name + '</div><div class="sd-role">' + s.role + '</div></div></div>';
  });
  document.getElementById('staffList').innerHTML = html;
})();

function openStaff() {
  document.getElementById('staffDrawer').classList.add('open');
  document.getElementById('staffBackdrop').classList.add('show');
  var t = document.getElementById('staffTab'); t.classList.add('open'); t.textContent = '«';
  var active = document.querySelector('.staff-tab-btn.active');
  var panel = active ? active.getAttribute('data-panel') : 'personnel';
  if (panel === 'stock') {
    fetchStock(function () { renderStock(); });
  }
  clearTimeout(staffTimer);
  staffTimer = setTimeout(closeStaff, 45000);
}
function closeStaff() {
  clearTimeout(staffTimer);
  document.getElementById('staffDrawer').classList.remove('open');
  document.getElementById('staffBackdrop').classList.remove('show');
  var t = document.getElementById('staffTab'); t.classList.remove('open'); t.textContent = '»';
}
function toggleStaff() {
  document.getElementById('staffDrawer').classList.contains('open') ? closeStaff() : openStaff();
}

];

function iconForName(name) {
  var n = (name || '').toLowerCase();
  if (n.indexOf('biogesic') >= 0 || n.indexOf('paracetamol') >= 0) return '💊';
  if (n.indexOf('bioflu') >= 0 || n.indexOf('neozep') >= 0 || n.indexOf('symdex') >= 0) return '🤧';
  if (n.indexOf('lagundi') >= 0 || n.indexOf('solmux') >= 0 || n.indexOf('cough') >= 0) return '🌿';
  if (n.indexOf('kremil') >= 0 || n.indexOf('buscopan') >= 0 || n.indexOf('diatabs') >= 0 || n.indexOf('loperamide') >= 0) return '🤢';
  if (n.indexOf('cetirizine') >= 0 || n.indexOf('levocetirizine') >= 0 || n.indexOf('allecure') >= 0 || n.indexOf('allergy') >= 0) return '🌸';
  if (n.indexOf('mefenamic') >= 0 || n.indexOf('mecid') >= 0) return '💊';
  if (n.indexOf('oresol') >= 0 || n.indexOf('rehydrat') >= 0) return '💧';
  if (n.indexOf('betadine') >= 0 || n.indexOf('povidone') >= 0 || n.indexOf('alcohol') >= 0 || n.indexOf('swab') >= 0) return '🧴';
  if (n.indexOf('silver') >= 0 || n.indexOf('sulfadiazine') >= 0) return '🧴';
  if (n.indexOf('band') >= 0 || n.indexOf('gauze') >= 0 || n.indexOf('cotton') >= 0) return '🩹';
  if (n.indexOf('salonpas') >= 0 || n.indexOf('compress') >= 0 || n.indexOf('ice') >= 0) return '🧊';
  if (n.indexOf('vicks') >= 0 || n.indexOf('white flower') >= 0 || n.indexOf('efficas') >= 0 || n.indexOf('manzanilla') >= 0) return '🌿';
  if (n.indexOf('glucose') >= 0 || n.indexOf('strip') >= 0) return '🩸';
  if (n.indexOf('mask') >= 0 || n.indexOf('facemask') >= 0) return '😷';
  if (n.indexOf('sanitary') >= 0) return '🩸';
  return '💊';
}

function mapServerItem(row) {
  return {
    id: String(row.id),
    name: row.item_name,
    cat: row.status || '',
    qty: row.level,
    status: row.status,
    icon: iconForName(row.item_name),
    fromServer: true
  };
}

function loadLocalStock() {
  try {
    var raw = localStorage.getItem(STOCK_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && Array.isArray(s) && s.length > 0) return s;
    }
  } catch (e) {}
  var seed = DEFAULT_STOCK.map(function (m) {
    return { id: m.id, name: m.name, cat: m.cat, qty: m.qty, icon: m.icon || '💊', fromServer: false };
  });
  try { localStorage.setItem(STOCK_KEY, JSON.stringify(seed)); } catch (e2) {}
  return seed;
}

function saveLocalStock(list) {
  try { localStorage.setItem(STOCK_KEY, JSON.stringify(list)); } catch (e) {}
}

function fetchStock(cb) {
  if (location.protocol === 'file:') {
    stockCache = loadLocalStock();
    if (cb) cb(stockCache);
    return;
  }
  var base = API || '';
  fetch(base + '/api/inventory', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) {
        stockCache = loadLocalStock();
      } else {
        stockCache = rows.map(mapServerItem);
      }
      if (cb) cb(stockCache);
    })
    .catch(function () {
      stockCache = loadLocalStock();
      if (cb) cb(stockCache);
    });
}

function adjustStock(id, delta) {
  var item = null;
  for (var i = 0; i < stockCache.length; i++) {
    if (String(stockCache[i].id) === String(id)) { item = stockCache[i]; break; }
  }
  if (!item) return;

  if (item.fromServer) {
    var base = API || '';
    fetch(base + '/api/inventory/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta: delta })
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (row) {
        item.qty = row.level;
        item.status = row.status;
        item.cat = row.status || item.cat;
        renderStock();
      })
      .catch(function () {
        item.qty = Math.max(0, Math.min(100, (item.qty || 0) + delta));
        renderStock();
      });
  } else {
    item.qty = Math.max(0, Math.min(100, (item.qty || 0) + delta));
    saveLocalStock(stockCache);
    renderStock();
  }
}

function addMedicine() {
  var input = document.getElementById('newMedName');
  var name = (input && input.value || '').trim();
  if (!name) { if (input) input.focus(); return; }

  var base = API || '';
  var tryServer = location.protocol !== 'file:';

  if (tryServer) {
    fetch(base + '/api/inventory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_name: name, level: 50 })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok) {
          stockCache.push(mapServerItem(res.d));
          if (input) input.value = '';
          renderStock();
        } else {
          alert(res.d && res.d.error ? res.d.error : 'Could not add item');
        }
      })
      .catch(function () {
        var id = 'med_' + Date.now();
        stockCache.push({ id: id, name: name, cat: 'Other', qty: 50, icon: '💊', fromServer: false });
        saveLocalStock(stockCache);
        if (input) input.value = '';
        renderStock();
      });
  } else {
    var id2 = 'med_' + Date.now();
    stockCache.push({ id: id2, name: name, cat: 'Other', qty: 50, icon: '💊', fromServer: false });
    saveLocalStock(stockCache);
    if (input) input.value = '';
    renderStock();
  }
}

function renderStock() {
  var list = stockCache && stockCache.length ? stockCache.slice() : [];
  var el = document.getElementById('stockList');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = '<div class="rec-empty">No stock data.<br>Open the dashboard to manage inventory.</div>';
    return;
  }
  var maxQ = 0;
  for (var m0 = 0; m0 < list.length; m0++) {
    var q0 = typeof list[m0].qty === 'number' ? list[m0].qty : 0;
    if (q0 > maxQ) maxQ = q0;
  }
  if (maxQ < 10) maxQ = 10;
  var out = '';
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    var qty = typeof m.qty === 'number' ? m.qty : 0;
    var cls = (m.status === 'critical' || qty === 0) ? 'out' : ((m.status === 'low' || qty <= 15) ? 'low' : 'ok');
    var rowCls = 'stock-item' + (cls === 'out' ? ' is-out' : cls === 'low' ? ' is-low' : '');
    var icon = m.icon || iconForName(m.name);
    var pct = Math.min(100, Math.round((qty / maxQ) * 100));
    var bf = cls === 'out' ? '#8b2e2b' : cls === 'low' ? '#a3690f' : '#0f5c3d';
    var bt = cls === 'out' ? '#ff7a7a' : cls === 'low' ? '#ffb84d' : '#7dffb0';
    var badge = cls === 'out' ? 'Out / Critical' : cls === 'low' ? 'Low stock' : 'Available';
    var delay = (i * 0.045).toFixed(2);
    out += '<div class="' + rowCls + '" style="animation-delay:' + delay + 's">' +
      '<div class="si-icon">' + icon + '</div>' +
      '<div class="si-info">' +
        '<div class="si-name">' + esc(m.name || '') + '</div>' +
        '<div class="si-cat">View only · synced from dashboard</div>' +
        '<div class="si-bar-wrap"><div class="si-bar-bg">' +
          '<div class="si-bar-fill" style="width:' + pct + '%;--bf:' + bf + ';--bt:' + bt + ';"></div>' +
        '</div></div>' +
      '</div>' +
      '<div class="si-right">' +
        '<div class="si-qty ' + cls + '">' + qty + '</div>' +
        '<span class="si-badge ' + cls + '">' + badge + '</span>' +
      '</div></div>';
  }
  el.innerHTML = out;
}




function switchStaffPanel(name) {
  var panels = document.querySelectorAll('.staff-panel');
  var btns = document.querySelectorAll('.staff-tab-btn');
  for (var i = 0; i < panels.length; i++) panels[i].classList.remove('active');
  for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
  var panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
  for (var k = 0; k < btns.length; k++) {
    if (btns[k].getAttribute('data-panel') === name) btns[k].classList.add('active');
  }
  if (name === 'stock') {
    fetchStock(function () { renderStock(); });
  }
}




tickClock();
setInterval(tickClock, 1000);
showIdle();
